<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogue Emblem</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      /* Phaser canvas and React HUD share one box; #ui overlays #game. */
      #stage {
        position: relative;
        width: 640px;
        height: 480px;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
